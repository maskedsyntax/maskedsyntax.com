<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" role="img" aria-labelledby="title desc">
  <title id="title">MaskedSyntax YouTube banner</title>
  <desc id="desc">MaskedSyntax wordmark and tagline on a dark developer-tool inspired background.</desc>
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#1B1D26" stroke-width="2"/>
    </pattern>
    <radialGradient id="leftGlow" cx="0" cy="50%" r="65%">
      <stop offset="0" stop-color="#3B5BFF" stop-opacity=".28"/>
      <stop offset="1" stop-color="#3B5BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightGlow" cx="100%" cy="50%" r="65%">
      <stop offset="0" stop-color="#3B5BFF" stop-opacity=".16"/>
      <stop offset="1" stop-color="#3B5BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#3B5BFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#3B5BFF"/>
      <stop offset="1" stop-color="#3B5BFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="2560" height="1440" fill="#090A0E"/>
  <rect width="2560" height="1440" fill="url(#grid)" opacity=".72"/>
  <rect width="2560" height="1440" fill="url(#leftGlow)"/>
  <rect width="2560" height="1440" fill="url(#rightGlow)"/>

  <!-- Edge detail stays intentionally outside the cross-device safe area. -->
  <g opacity=".62" fill="none" stroke="#343847" stroke-width="3">
    <path d="M0 360h280l96 96h212l80-80h168"/>
    <path d="M0 1076h316l84-84h190l76 76h250"/>
    <path d="M2560 330h-270l-92 92h-208l-82-82h-170"/>
    <path d="M2560 1110h-328l-74-74h-178l-96 96h-220"/>
  </g>
  <g fill="#3B5BFF">
    <circle cx="376" cy="456" r="10"/><circle cx="400" cy="992" r="10"/>
    <circle cx="2198" cy="422" r="10"/><circle cx="2158" cy="1036" r="10"/>
  </g>
  <g font-family="'Space Mono', 'SpaceMono Nerd Font', ui-monospace, monospace" font-size="34" fill="#73798B" opacity=".65">
    <text x="92" y="310">alias://masked</text>
    <text x="92" y="1148">ship --small --useful</text>
    <text x="2075" y="286">*.maskedsyntax.com</text>
    <text x="2102" y="1192">build / ship / note</text>
  </g>

  <!-- All meaningful content is inside the centered 1546 × 423 safe area. -->
  <g transform="translate(586 585)">
    <rect x="0" y="0" width="1388" height="270" rx="28" fill="#0E1016" stroke="#272A36" stroke-width="3"/>
    <rect x="0" y="0" width="12" height="270" rx="6" fill="#3B5BFF"/>
    <g transform="translate(42 27) scale(1.7)">
      <path fill="#F7F7F8" d="M18 20 68 49 54 57v53L18 89V20Z"/>
      <path fill="#3B5BFF" d="m47 51 63-33v46L78 82V65l-9-5v34L47 81V51Z"/>
      <path fill="#F7F7F8" d="m74 62 36 21v27H74V62Z"/>
    </g>
    <g transform="translate(284 0)">
      <text x="0" y="118" fill="#F7F7F8" font-family="'Space Mono', 'SpaceMono Nerd Font', ui-monospace, monospace" font-size="84" font-weight="700" letter-spacing="-4">MaskedSyntax</text>
      <rect x="0" y="148" width="700" height="4" rx="2" fill="url(#line)"/>
      <text x="0" y="206" fill="#A8ADBA" font-family="'Space Mono', 'SpaceMono Nerd Font', ui-monospace, monospace" font-size="31" letter-spacing=".4">Small tools built for everyday use.</text>
    </g>
  </g>
</svg>
